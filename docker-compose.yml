# GDPR RAG/MCP knowledge server - full local stack.
# One `docker compose up` brings the whole server online on the German host.
# retrieval-api is the ONLY service that talks to qdrant, ollama and postgres.
# mcp-server is a parallel client of retrieval-api (a later UI attaches the same way).

services:
  retrieval-api:
    build: .
    command: uvicorn app.retrieval_api:app --host 0.0.0.0 --port 8000
    environment:
      QDRANT_URL: http://qdrant:6333
      OLLAMA_URL: http://ollama:11434
      OLLAMA_MODEL: qwen3:14b
      # DATABASE_URL: postgresql://rag:rag@postgres:5432/rag
    ports: ["8000:8000"]
    depends_on: [qdrant, ollama, postgres]

  mcp-server:
    build: .
    command: uvicorn app.mcp_server:app --host 0.0.0.0 --port 8080
    environment:
      RETRIEVAL_API_URL: http://retrieval-api:8000
      OAUTH_TOKENS: "demo-token:acme"   # replace with real OAuth 2.0 introspection
    ports: ["8080:8080"]
    depends_on: [retrieval-api]

  qdrant:
    image: qdrant/qdrant:latest
    volumes: ["qdrant_data:/qdrant/storage"]
    ports: ["6333:6333"]

  ollama:
    image: ollama/ollama:latest
    volumes: ["ollama_data:/root/.ollama"]
    ports: ["11434:11434"]
    # GPU passthrough on the GEX44:
    # deploy:
    #   resources:
    #     reservations:
    #       devices: [{ driver: nvidia, count: all, capabilities: [gpu] }]

  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: rag
      POSTGRES_PASSWORD: rag
      POSTGRES_DB: rag
    volumes: ["pg_data:/var/lib/postgresql/data"]
    ports: ["5432:5432"]

volumes:
  qdrant_data:
  ollama_data:
  pg_data:
